sonar.log.level=INFO
sonar.verbose=false
sonar.qualitygate.wait=false

# Project details (the SonarCloud project is created by an admin)
sonar.projectKey=rudderlabs_rudder-monorepo-swift
sonar.organization=rudderlabs
sonar.projectName=RudderStack Swift Monorepo

# Meta-data for the project
sonar.links.scm=https://github.com/rudderlabs/rudder-monorepo-swift

# Sources: the existing package folders, passed by the ci.yml sonarcloud job (-Dsonar.sources=Packages,Integrations).
# Package tests stay out of the scan.
sonar.exclusions=**/Tests/**,**/*Tests*/**
sonar.sourceEncoding=UTF-8

# Exclusions for copy-paste detection
sonar.cpd.exclusions=Examples/**/*,**/Tests/**
